[project]
name = "mindful"
version = "0.6.1.dev0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leo Huber", email = "leo_huber@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anki>=26.9.4",
]

[project.scripts]
mindful = "mindful:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ALL", "DOC201", "DOC402", "DOC501", "DOC502"]
ignore = [
    "TD",
    "CPY001",
    "TC001",
    "TC002",
    "TC003",
    "UP037",
    "COM812",
    "TID252", # The add-on must use relative imports so numeric AnkiWeb directory names work
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "PLR0913", # Parameterized tests may expose more than five case values
    "PLR0917", # Parameterized tests may expose more than five positional values
    "INP001",
    "D", # Docstrings are only required for luna_app source
    "DOC"
]
"tests/conftest.py" = ["F811"]
"tests/integration/addon_archive_test.py" = ["S603"]
"tests/architecture/import_contracts_test.py" = ["S603"]
"tests/integration/addon_lifecycle_test.py" = ["S603"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "aqt>=26.9.4",
    "pre-commit==4.6.2",
    "ruff==0.16.7",
    "pytest==9.1.1",
    "pip-licenses==5.5.5",
    "import-linter==2.15",
    "pydeps==3.0.8",
    "pyrefly>=1.4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mindful"]
exclude = [
  "/.github",
  "/tests",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
